<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Sem zoom por gesto: no celular, tocar e arrastar são comandos do jogo. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0b1220" />
    <title>Merge do Escritório</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1220; overscroll-behavior: none; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; height: 100dvh; }
      #game canvas { touch-action: none; }
      body { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
      input, textarea { -webkit-user-select: text; user-select: text; }

      /* O jogo é deitado: num celular em pé, pede para girar. */
      #rotate-notice { display: none; position: fixed; inset: 0; z-index: 2000; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #0b1220; color: #e5e7eb; font: bold 20px Arial, sans-serif; }
      #rotate-notice span { font-size: 56px; }
      @media (orientation: portrait) and (max-width: 900px) and (pointer: coarse) { #rotate-notice { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-notice" role="status"><span aria-hidden="true">📱↻</span>Gire o aparelho para jogar deitado.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
