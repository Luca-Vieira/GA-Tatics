<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Merge do Escritório — Administração</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #0b1220; color: #e5e7eb; font-family: Arial, sans-serif; font-size: 15px; }
      #app { max-width: 1180px; margin: 0 auto; padding: 24px; }
      h1 { margin: 0 0 4px; font-size: 26px; }
      h2 { margin: 0 0 10px; font-size: 18px; }
      .muted { color: #94a3b8; }
      .panel { background: #16213a; border: 2px solid #2f3e5c; border-radius: 8px; padding: 18px; }
      .login { max-width: 460px; margin: 60px auto; display: flex; flex-direction: column; gap: 12px; }
      label { display: flex; flex-direction: column; gap: 4px; color: #94a3b8; font-size: 13px; }
      input, textarea, select { background: #0f1a30; color: #e5e7eb; border: 1px solid #3b4d73; border-radius: 5px; padding: 9px 10px; font-size: 15px; font-family: inherit; }
      textarea { font-family: Consolas, 'Courier New', monospace; font-size: 13px; line-height: 1.45; width: 100%; min-height: 420px; resize: vertical; }
      button { padding: 9px 14px; border: 0; border-radius: 5px; color: #fff; background: #2563eb; font-size: 14px; font-weight: bold; cursor: pointer; }
      button:hover:not(:disabled) { filter: brightness(1.15); }
      button:disabled { opacity: 0.5; cursor: not-allowed; }
      button.good { background: #16a34a; }
      button.danger { background: #dc2626; }
      button.quiet { background: #334155; }
      .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
      .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
      .tabs button { background: #1f2d4a; }
      .tabs button.active { background: #2563eb; }
      .columns { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 16px; }
      .list { display: flex; flex-direction: column; gap: 4px; max-height: 560px; overflow: auto; }
      .item { display: flex; gap: 8px; align-items: center; padding: 7px 9px; border-radius: 5px; background: #0f1a30; cursor: pointer; border: 1px solid transparent; }
      .item.selected { border-color: #2563eb; }
      .item.inactive .name { opacity: 0.55; }
      .item .name { flex: 1; }
      .item input { padding: 0; }
      .error { color: #f87171; white-space: pre-wrap; margin: 8px 0 0; min-height: 18px; }
      .ok { color: #4ade80; margin: 8px 0 0; }
      .issues { margin-top: 14px; padding: 12px; border-radius: 6px; background: #3b1d1d; color: #fecaca; white-space: pre-wrap; font-size: 13px; }
      .good-box { margin-top: 14px; padding: 12px; border-radius: 6px; background: #14301f; color: #bbf7d0; font-size: 13px; }
      .note { font-size: 13px; color: #94a3b8; margin: 10px 0 0; }
      .help { font-size: 12px; color: #64748b; }
      .form { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
      details.section { background: #0f1a30; border: 1px solid #2f3e5c; border-radius: 6px; padding: 10px 12px; }
      details.section > summary { cursor: pointer; font-weight: bold; margin-bottom: 8px; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; margin-bottom: 8px; }
      label.inline { flex-direction: row; align-items: center; gap: 8px; }
      .small-area { min-height: 80px; font-family: inherit; font-size: 14px; }
      h3 { margin: 12px 0 6px; font-size: 14px; color: #cbd5e1; }
      .effect { border: 1px solid #2f3e5c; border-radius: 6px; padding: 10px; margin-bottom: 10px; background: #111c33; }
      .row.top { align-items: flex-start; }
      .sprite-preview { width: 110px; min-height: 110px; display: flex; align-items: center; justify-content: center; background: #0b1220; border: 1px dashed #3b4d73; border-radius: 6px; padding: 6px; text-align: center; font-size: 12px; }
      .sprite-preview img { object-fit: contain; image-rendering: pixelated; }
      input[type="color"] { padding: 2px; height: 38px; }
      input[type="file"] { font-size: 13px; }
      .row.spaced { margin-top: 12px; }
      .dot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; flex: none; }
      .warn-text { color: #fbbf24; font-size: 12px; }
      .effect.inner { margin: 8px 0; background: #0f1a30; }
      .chip { border: 2px solid #3b4d73; border-radius: 14px; padding: 4px 10px; font-size: 13px; background: #0f1a30; }
      .chip.bad { background: #3b1d1d; color: #fecaca; }
      .counts { margin: 8px 0 12px; }
      .import-area { min-height: 140px; width: 100%; }
      details.section { margin-top: 12px; }
      details.section label.inline { margin-top: 6px; }
      .tabs { flex-wrap: wrap; }
      .columns > * { min-width: 0; }
      .columns.spaced { margin-top: 12px; }
      .row.between { justify-content: space-between; }
      button.item { color: inherit; font-weight: normal; text-align: left; font-size: 14px; background: #0f1a30; }
      .thumbnail { width: 28px; height: 28px; object-fit: contain; flex: none; text-align: center; line-height: 28px; }
      .adjust-layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
      .stage-column { display: flex; flex-direction: column; gap: 8px; }
      .sprite-stage { width: 100%; max-width: 480px; background: #0b1220; border: 1px dashed #3b4d73; border-radius: 6px; touch-action: none; cursor: move; image-rendering: pixelated; }
      .adjust-controls { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
      .slider-row { display: flex; gap: 8px; align-items: center; }
      .slider-row input[type="range"] { flex: 1; min-width: 0; padding: 0; }
      .slider-row input[type="number"] { width: 84px; flex: none; }
      .icon-row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr) minmax(0, 1fr); gap: 10px; align-items: end; margin-bottom: 8px; }
      .icon-row input { width: 100%; }
      .attack-preview { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
      .attack-drawing { max-width: 100%; height: auto; }
      @media (max-width: 960px) {
        .adjust-layout { grid-template-columns: minmax(0, 1fr); }
      }
      @media (max-width: 720px) {
        #app { padding: 10px; }
        .panel { padding: 12px; }
        .login { margin: 16px auto; }
        .columns { grid-template-columns: minmax(0, 1fr); }
        .list { max-height: 260px; }
        .grid { grid-template-columns: minmax(0, 1fr); }
        .icon-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
        .icon-row .name { grid-column: 1 / -1; }
        input, textarea, select { max-width: 100%; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/admin/main.ts"></script>
  </body>
</html>
